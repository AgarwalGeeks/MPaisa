name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mpaisa
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REPOSITORY .
          docker tag $ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          AWS_REGION: ap-south-1
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mpaisa
        run: |
          echo "$EC2_SSH_KEY" > ec2.pem
          chmod 600 ec2.pem

          ssh -o StrictHostKeyChecking=no -i ec2.pem ${EC2_USER}@${EC2_HOST} << EOF
            set -e

            echo "Logging into ECR"
            echo "ECR_REGISTRY=${ECR_REGISTRY}"

            aws ecr get-login-password --region ap-south-1 \
              | docker login --username AWS --password-stdin ${ECR_REGISTRY}

            echo "Pulling latest image"
            docker pull ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

            echo "Stopping old container"
            docker stop mpaisa || true
            docker rm mpaisa || true

            echo "Fetching secrets"
            aws secretsmanager get-secret-value \
              --secret-id mpaisa/prod/db \
              --region ap-south-1 \
              --query SecretString \
              --output text | jq -r . > /tmp/db.json

            aws secretsmanager get-secret-value \
              --secret-id mpaisa/prod/auth \
              --region ap-south-1 \
              --query SecretString \
              --output text | jq -r . > /tmp/auth.json

            echo "Creating env file"
            rm -f /tmp/prod.env
            jq -r 'to_entries | .[] | "\(.key)=\(.value)"' /tmp/db.json >> /tmp/prod.env
            jq -r 'to_entries | .[] | "\(.key)=\(.value)"' /tmp/auth.json >> /tmp/prod.env

            echo "Starting new container"
            docker run -d \
              --name mpaisa \
              --env-file /tmp/prod.env \
              -p 8091:8091 \
              ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

            echo "Waiting for app to boot"
            sleep 8

            echo "Health check"
            curl -f http://localhost:8091/healthz

            echo "Deployment successful"
          EOF

          rm -f ec2.pem
