name: Deploy to production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mpaisa
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t mpaisa:${IMAGE_TAG} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push -a $ECR_REGISTRY/$ECR_REPOSITORY

      - name: Debug network connectivity
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "GitHub Actions Runner IP:"
          curl -s https://api.ipify.org
          echo ""
          echo "Testing connectivity to EC2..."
          nc -vz ${EC2_HOST} 22 || echo "Port 22 not reachable"
          nc -vz ${EC2_HOST} 8091 || echo "Port 8091 not reachable"
          echo "DNS resolution:"
          nslookup ${EC2_HOST} || true

      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mpaisa
          IMAGE_TAG: ${{ github.sha }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          AWS_REGION: ap-south-1
          DB_SECRET_NAME: ${{ secrets.DB_SECRET_NAME }}
          AUTH_SECRET_NAME: ${{ secrets.AUTH_SECRET_NAME }}
        run: |
          # Save SSH key
          echo "$EC2_SSH_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          
          # Deploy to EC2
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${EC2_USER}@${EC2_HOST} bash -s << EOF
            # Login to ECR
            aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
            
            # Stop and remove old container
            docker stop mpaisa || true
            docker rm mpaisa || true
            
            # Pull latest image
            docker pull ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
            
            # Fetch DB secrets from AWS Secrets Manager
            aws secretsmanager get-secret-value --secret-id ${DB_SECRET_NAME} --region ${AWS_REGION} --query SecretString --output text > /tmp/db_secrets.json
            
            # Fetch Auth secrets from AWS Secrets Manager
            aws secretsmanager get-secret-value --secret-id ${AUTH_SECRET_NAME} --region ${AWS_REGION} --query SecretString --output text > /tmp/auth_secrets.json
            
            # Create prod.env file by concatenating both secrets
            echo "# Database Configuration" > /tmp/prod.env
            jq -r 'to_entries | .[] | "\(.key)=\(.value)"' /tmp/db_secrets.json >> /tmp/prod.env
            echo "" >> /tmp/prod.env
            echo "# Authentication Configuration" >> /tmp/prod.env
            jq -r 'to_entries | .[] | "\(.key)=\(.value)"' /tmp/auth_secrets.json >> /tmp/prod.env
            
            # Run new container with environment variables
            docker run -d \
              --name mpaisa \
              -p 8091:8091 \
              --env-file /tmp/prod.env \
              ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
            
            # Wait for container to start
            sleep 5
            
            # Verify container is running
            docker ps | grep mpaisa
            
            # Health check
            echo "Running health check..."
            HEALTH_STATUS=\$(curl -f http://localhost:8091/healthz || echo "FAILED")
            if [ "\$HEALTH_STATUS" = "FAILED" ]; then
              echo "Health check failed!"
              docker logs mpaisa
              exit 1
            fi
            echo "Health check passed: \$HEALTH_STATUS"
            
            # Cleanup
            rm -f /tmp/db_secrets.json /tmp/auth_secrets.json /tmp/prod.env
          EOF
          
          # Cleanup SSH key
          rm -f ec2_key.pem